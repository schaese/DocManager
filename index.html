<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KI-Dokumentenarchiv</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>KI-Dokumentenarchiv PWA</h1>
    <nav>
      <button id="nav-scan">Erfassen</button>
      <button id="nav-archive">Archiv</button>
      <button id="nav-tasks">Fristen</button>
      <button id="nav-settings">Einstellungen</button>
    </nav>
  </header>

  <main id="app-content">
    <!-- Dynamic views loaded here -->
    <section id="view-setup" class="view">
      <h2>Ersteinrichtung (M0/M1)</h2>
      <p>Bitte geben Sie Ihre Google OAuth Client-ID und den Gemini API-Schlüssel ein.</p>
      <form id="form-setup">
        <label>Google OAuth Client-ID: <input type="text" id="cfg-client-id" required></label>
        <label>Gemini API-Schlüssel: <input type="password" id="cfg-gemini-key" required></label>
        <button type="submit">Speichern & Anmelden</button>
      </form>
    </section>

    <section id="view-scan" class="view hidden">
      <h2>Dokument erfassen (M2/M3)</h2>
      <input type="file" id="file-input" accept="image/*,application/pdf" capture="environment">
      <div id="preview-container"></div>
      <button id="btn-analyze" class="hidden">KI-Analyse starten</button>

      <div id="confirmation-card" class="hidden">
        <h3>Bestätigungskarte (M3)</h3>
        <form id="form-confirm">
          <label>Absender: <input type="text" id="meta-sender" required></label>
          <label>Dokumententyp: 
            <select id="meta-type">
              <option value="Rechnung">Rechnung</option>
              <option value="Vertrag">Vertrag</option>
              <option value="Bescheid">Bescheid</option>
              <option value="Sonstiges">Sonstiges</option>
            </select>
          </label>
          <label>Datum: <input type="date" id="meta-date" required></label>
          <label>Betrag (€): <input type="number" step="0.01" id="meta-amount"></label>
          <label>Fälligkeit: <input type="date" id="meta-due-date"></label>
          <label>IBAN: <input type="text" id="meta-iban"><span id="iban-validation"></span></label>
          <label>Zusammenfassung: <textarea id="meta-summary"></textarea></label>
          <button type="submit">In Google Drive archivieren</button>
        </form>
      </div>
    </section>

    <section id="view-archive" class="view hidden">
      <h2>Dokumentenarchiv (M4)</h2>
      <input type="search" id="search-input" placeholder="Volltextsuche...">
      <div id="archive-list"></div>
    </section>

    <section id="view-tasks" class="view hidden">
      <h2>Offene Fristen (M5)</h2>
      <div id="tasks-list"></div>
    </section>
  </main>

  <script src="js/validation.js"></script>
  <script src="js/db.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/gemini.js"></script>
  <script src="app.js"></script>
</body>
</html>
